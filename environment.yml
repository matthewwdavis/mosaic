name: figassemble
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pikepdf        # PDF writing; places PDF pages unchanged
  - pypdfium2      # rendering (previews, PNG/TIFF export)
  - pillow
  - lxml
  - fonttools      # font metrics and embedding
  - numpy
  - shapely>=2.1   # areas enclosed by lines and shapes (live area fills)
  - pytest
  - ghostscript    # optional: EPS export, CMYK PDF
  - librsvg        # optional: SVG -> PDF when a plot has no PDF copy
  - poppler        # optional: PDF -> SVG when a plot has no SVG copy
  - pip:
      - pywebview>=6   # app window (conda-forge has no macOS build)
