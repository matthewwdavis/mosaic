name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # macOS is tested locally; CI covers the other platforms labmates use
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: mosaic
          miniforge-version: latest
      - name: Run tests
        run: python -m pytest -q
