# Runs both installers on fresh machines without conda, as a collaborator would, and checks the
# result; then the installed copy updates itself, goes back a version and takes a test version
# (tools/update_e2e.py, from a stand-in GitHub). Only when the installers, what they install or
# the updates change (macOS minutes cost more), or by hand.
name: installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - install-mac.command
      - install-windows.bat
      - environment.yml
      - pyproject.toml
      - packaging/**
      - figassemble/updates.py
      - tools/release.py
      - tools/fake_github.py
      - tools/update_e2e.py
      - .github/workflows/installers.yml

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Mac installer
        run: bash install-mac.command
        env:
          FIGASSEMBLE_NO_OPEN: "1"
          FIGASSEMBLE_APP_DIR: ${{ runner.temp }}/Applications
      - name: Check the app and the installed copy of FigAssemble
        run: |
          app="$RUNNER_TEMP/Applications/FigAssemble.app/Contents/MacOS/FigAssemble"
          test -x "$app"
          # The environment's Python, linked into the app, runs from there so macOS names it FigAssemble
          py="$RUNNER_TEMP/Applications/FigAssemble.app/Contents/MacOS/python"
          test -L "$py"
          cd "$RUNNER_TEMP"   # away from the source folder, so the installed copy is the one tested
          "$py" -c "import figassemble, os; ui = os.path.join(os.path.dirname(figassemble.__file__), 'ui', 'index.html'); assert os.path.exists(ui), ui; print(figassemble.__file__)"
          "$py" -c "import Foundation; name = Foundation.NSBundle.mainBundle().infoDictionary()['CFBundleName']; assert name == 'FigAssemble', name"
          "$py" -m figassemble export --help
      - name: The installed copy updates itself, goes back and takes a test version
        run: |
          py="$RUNNER_TEMP/Applications/FigAssemble.app/Contents/MacOS/python"
          "$py" tools/update_e2e.py --python "$py"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the Windows installer
        shell: cmd
        run: install-windows.bat
        env:
          FIGASSEMBLE_NO_OPEN: "1"
      - name: Check the shortcuts and the installed copy of FigAssemble
        shell: pwsh
        run: |
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\FigAssemble.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          $py = Join-Path (Split-Path $target) 'python.exe'
          Set-Location $env:RUNNER_TEMP   # away from the source folder, so the installed copy is the one tested
          & $py -c "import figassemble, os; ui = os.path.join(os.path.dirname(figassemble.__file__), 'ui', 'index.html'); assert os.path.exists(ui), ui; print(figassemble.__file__)"
          & $py -m figassemble export --help
          if ($LASTEXITCODE -ne 0) { throw "figassemble didn't start" }
      - name: The installed copy updates itself, goes back and takes a test version
        shell: pwsh
        run: |
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\FigAssemble.lnk'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          $py = Join-Path (Split-Path $target) 'python.exe'
          & $py tools/update_e2e.py --python $py
          if ($LASTEXITCODE -ne 0) { throw "updating didn't work" }
