[build-system]
requires = ["setuptools>=77"]   # (license as an SPDX expression)
build-backend = "setuptools.build_meta"

[project]
name = "mosaic"
dynamic = ["version"]   # mosaic/__init__.py
description = "Assemble multi-panel scientific figures without lossy format conversions"
license = "MIT"   # the code; the documentation is CC BY 4.0 (LICENSE-docs)
license-files = ["LICENSE", "LICENSE-docs", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "pikepdf>=10,<11",          # (the bounds follow environment.yml)
    "pypdfium2>=5,<6",
    "pillow>=12,<14",
    "lxml>=5,<7",
    "fonttools>=4.50,<5",
    "numpy>=2,<3",
    "shapely>=2.1,<3",
    "skia-pathops>=0.8,<1",
    "matplotlib>=3.9,<4",
    "python-pptx>=1,<2",
    "pywebview>=6,<7",
    "cryptography>=44",
]

[project.scripts]
mosaic = "mosaic.cli:main"

[tool.setuptools.dynamic]
version = {attr = "mosaic.__version__"}

[tool.setuptools.packages.find]
include = ["mosaic*"]

[tool.setuptools.package-data]
mosaic = ["ui/**/*", "data/*"]

[tool.setuptools.exclude-package-data]
mosaic = ["**/claude-commands.log", "**/.DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
